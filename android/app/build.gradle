plugins {
    id 'com.android.application'
}
android {
    namespace 'com.payawaaz.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.payawaaz.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
